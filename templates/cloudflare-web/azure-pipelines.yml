trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    fetchDepth: 0
  - task: NodeTool@0
    inputs:
      versionSpec: 24.x
  - script: npm run setup
    displayName: Setup
  - script: npm run validate
    displayName: Validate
  - script: node scripts/scan-personal-data.mjs
    displayName: Personal data
  - script: pipx install semgrep && node scripts/scan-semgrep.mjs --config .semgrep --config p/typescript --config p/react --config p/owasp-top-ten --error --metrics off --exclude node_modules --exclude dist --exclude .wrangler .
    displayName: Semgrep
  - script: |
      curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      ./gitleaks git --config .gitleaks.toml --redact --no-banner .
    displayName: Secrets (gitleaks)
