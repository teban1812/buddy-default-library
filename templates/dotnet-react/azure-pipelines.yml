trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    fetchDepth: 0
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - script: npm run setup
    displayName: Setup
  - script: npm run validate
    displayName: Validate
  - script: pipx install semgrep && semgrep scan --config .semgrep --config p/csharp --config p/typescript --config p/react --config p/owasp-top-ten --error --metrics off --exclude web/node_modules --exclude .artifacts .
    displayName: Semgrep
  - script: |
      curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      ./gitleaks git --config .gitleaks.toml --redact --no-banner .
    displayName: Secrets (gitleaks)
