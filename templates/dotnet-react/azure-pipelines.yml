trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']
pool:
  vmImage: ubuntu-latest
steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - script: npm run setup
    displayName: Setup
  - script: npm run validate
    displayName: Validate
